<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VPN Leak Lab banner">
  <!-- background -->
  <rect width="1280" height="320" fill="#1c2128"/>
  <!-- subtle grid -->
  <g stroke="#2d333b" stroke-width="1" opacity="0.5">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280"/>
    <path d="M160 0 V320 M320 0 V320 M480 0 V320 M640 0 V320 M800 0 V320 M960 0 V320 M1120 0 V320"/>
  </g>

  <!-- left: title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="96" width="6" height="128" rx="3" fill="#57ab5a"/>
    <text x="92" y="150" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="0.5">VPN Leak Lab</text>
    <text x="94" y="190" font-size="21" fill="#9aa4b2">Understanding, detecting and analyzing VPN traffic leaks</text>
    <text x="94" y="222" font-size="15" fill="#6e7a8a" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">Linux networking &#183; WireGuard &#183; packet analysis &#183; hands-on labs</text>
  </g>

  <!-- right: tunnel + leak illustration -->
  <g>
    <!-- client node -->
    <rect x="700" y="128" width="70" height="64" rx="8" fill="#2d333b" stroke="#444c56" stroke-width="1.5"/>
    <text x="735" y="166" text-anchor="middle" font-size="13" fill="#adbac7" font-family="'SFMono-Regular', Consolas, monospace">client</text>

    <!-- tunnel walls -->
    <path d="M770 138 H1050" stroke="#539bf5" stroke-width="3" stroke-linecap="round"/>
    <path d="M770 182 H1050" stroke="#539bf5" stroke-width="3" stroke-linecap="round"/>

    <!-- encapsulated packets inside tunnel -->
    <g fill="#57ab5a">
      <rect x="800" y="150" width="34" height="20" rx="4"/>
      <rect x="852" y="150" width="34" height="20" rx="4"/>
      <rect x="956" y="150" width="34" height="20" rx="4"/>
    </g>
    <g fill="#1c2128" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">
      <text x="817" y="164">enc</text>
      <text x="869" y="164">enc</text>
      <text x="973" y="164">enc</text>
    </g>

    <!-- leaking packet escaping below the tunnel -->
    <path d="M915 170 C 915 210, 915 224, 915 246" stroke="#e5534b" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <rect x="898" y="246" width="34" height="20" rx="4" fill="#e5534b"/>
    <text x="915" y="260" text-anchor="middle" font-size="10" fill="#1c2128" font-family="'SFMono-Regular', Consolas, monospace">leak</text>
    <text x="915" y="290" text-anchor="middle" font-size="12" fill="#e5534b" font-family="'SFMono-Regular', Consolas, monospace">DNS / IPv6 leak</text>

    <!-- server node -->
    <rect x="1050" y="128" width="70" height="64" rx="8" fill="#2d333b" stroke="#444c56" stroke-width="1.5"/>
    <text x="1085" y="166" text-anchor="middle" font-size="13" fill="#adbac7" font-family="'SFMono-Regular', Consolas, monospace">server</text>

    <!-- arrow to internet -->
    <path d="M1120 160 H1180" stroke="#6e7a8a" stroke-width="2"/>
    <path d="M1180 160 l-10 -6 v12 z" fill="#6e7a8a"/>
    <text x="1212" y="164" text-anchor="middle" font-size="12" fill="#9aa4b2" font-family="'SFMono-Regular', Consolas, monospace">net</text>
  </g>
</svg>