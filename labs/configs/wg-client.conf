# WireGuard CLIENT template — full tunnel (IPv4 + IPv6).
# PLACEHOLDERS ONLY. Generate your own keys (see configs/README.md) and replace
# every <...> before use. Never commit a filled-in private key.
#
# Bring up with:   sudo wg-quick up ./wg-client.conf
# Tear down with:  sudo wg-quick down ./wg-client.conf

[Interface]
# This machine's private key (generated locally, kept secret).
PrivateKey = <CLIENT_PRIVATE_KEY>
# Inner tunnel address for the client.
Address = 10.8.0.2/32
# Use the server's resolver while the tunnel is up (prevents DNS leaks).
DNS = 10.8.0.1
# Lower MTU to leave room for encapsulation headers.
MTU = 1420

[Peer]
# The server's public key.
PublicKey = <SERVER_PUBLIC_KEY>
# The server's reachable endpoint (its lab/physical address + WireGuard port).
Endpoint = 192.0.2.20:51820
# Full tunnel: send ALL IPv4 and IPv6 traffic to this peer.
AllowedIPs = 0.0.0.0/0, ::/0
# Keep NAT mappings alive; harmless on a direct lab link.
PersistentKeepalive = 25