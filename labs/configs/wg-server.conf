# WireGuard SERVER template.
# PLACEHOLDERS ONLY. Generate your own keys (see configs/README.md) and replace
# every <...> before use. Never commit a filled-in private key.
#
# Bring up with:   sudo wg-quick up ./wg-server.conf
# Tear down with:  sudo wg-quick down ./wg-server.conf
#
# Also enable forwarding on the server (once):
#   sudo sysctl -w net.ipv4.ip_forward=1
#   sudo sysctl -w net.ipv6.conf.all.forwarding=1
# Substitute your real external interface for eth0 in PostUp/PostDown.

[Interface]
PrivateKey = <SERVER_PRIVATE_KEY>
Address = 10.8.0.1/24
ListenPort = 51820
MTU = 1420
# Forward tunnel traffic and masquerade it out the external interface so
# destinations see the server's address, not the client's tunnel address.
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# The client's public key.
PublicKey = <CLIENT_PUBLIC_KEY>
# The tunnel address(es) this client is allowed to use.
AllowedIPs = 10.8.0.2/32